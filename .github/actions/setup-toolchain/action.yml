name: Set up toolchain
description: >-
  Installs a stack's toolchain and the repo's dependencies, for the stack scripts/toolchain.py resolved. Runs in the
  caller repo's checkout.

inputs:
  stack:
    description: bun, go, assets or none.
    required: true
  bun-version:
    description: Bun version. Empty uses .bun-version, then package.json (packageManager, engines.bun), then latest.
    required: false
    default: ""
  ignore-scripts:
    description: Install dependencies without their lifecycle scripts (untrusted checkouts).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - if: inputs.stack != 'bun' && inputs.stack != 'go' && inputs.stack != 'assets' && inputs.stack != 'none'
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
      run: |
        echo "::error::Unknown stack '$STACK' (expected bun, go, assets or none)."
        exit 1

    - id: bun-file
      if: inputs.stack == 'bun'
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
      run: |
        if [ -z "$BUN_VERSION" ] && [ -f .bun-version ]; then echo "file=.bun-version" >> "$GITHUB_OUTPUT"; fi
    - if: inputs.stack == 'bun'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
        bun-version-file: ${{ steps.bun-file.outputs.file }}
    - if: inputs.stack == 'bun'
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        if [ -f package.json ]; then
          if [ "$IGNORE_SCRIPTS" = true ]; then bun install --frozen-lockfile --ignore-scripts;
          else bun install --frozen-lockfile; fi
        else
          echo "::notice::No package.json, dependencies not installed."; fi

    # Assets repos optimize SVGs with bunx svgo and store the binaries in Git LFS. No package.json, so nothing to
    # install; git lfs pull only fetches objects, it runs no repository code.
    - if: inputs.stack == 'assets'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
    - if: inputs.stack == 'assets'
      shell: bash
      run: |
        git lfs install
        git lfs pull

    - if: inputs.stack == 'go'
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    # Go repos lint with golangci-lint (org standards); the version is the repo's pin, as in its own CI. Under
    # ignore-scripts the checkout is untrusted, so its Makefile never runs and golangci-lint is not installed.
    - if: inputs.stack == 'go' && inputs.ignore-scripts == 'true'
      shell: bash
      run: |
        echo "::notice::ignore-scripts: skipping the Makefile's golangci-lint pin; golangci-lint not installed."
    - id: golangci-version
      if: inputs.stack == 'go' && inputs.ignore-scripts != 'true'
      shell: bash
      run: |
        version=$(make -s golangci-lint-version 2>/dev/null || true)
        if [ -z "$version" ]; then
          echo "::notice::No golangci-lint-version make target; golangci-lint not installed."
        else
          echo "version=$version" >> "$GITHUB_OUTPUT"
        fi
    - if: inputs.stack == 'go' && steps.golangci-version.outputs.version != ''
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: ${{ steps.golangci-version.outputs.version }}
        install-only: true
    # local: build with the go.mod version setup-go installed, never a toolchain go.mod would download.
    - if: inputs.stack == 'go'
      shell: bash
      run: |
        echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
        GOTOOLCHAIN=local go mod download
