name: Loop / mention

on:
  workflow_call:
    inputs:
      loop_ref:
        description: Ref of crucibledx/factory-loop to load the toolchain resolver and setup from.
        type: string
        default: v0
    secrets:
      FACTORY_API_KEY:
        required: true

jobs:
  droid:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@droid')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@droid')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@droid'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crucibledx/factory-loop
          ref: ${{ inputs.loop_ref }}
          path: .factory-loop
          persist-credentials: false
      - id: toolchain
        run: python3 .factory-loop/scripts/toolchain.py
      - uses: ./.factory-loop/.github/actions/setup-toolchain
        with:
          stack: ${{ steps.toolchain.outputs.stack }}
      - uses: Factory-AI/droid-action@035954f0d86a72304d87a75a8625aa34699e1274 # v14
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          settings: '{"extraKnownMarketplaces":{"factory-loop":{"source":{"source":"github","repo":"crucibledx/factory-loop"}}},"enabledPlugins":{"crucible-loop@factory-loop":true}}'
