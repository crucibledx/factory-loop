# factory-loop reviews its own PRs with the review workflow from the PR branch, so changes are tested before release.
name: Self review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    uses: ./.github/workflows/loop-review.yml
    with:
      loop_ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  automerge:
    if: >-
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') ||
      (github.event_name == 'pull_request' && github.event.action == 'synchronize')
    uses: ./.github/workflows/loop-automerge.yml
    with:
      loop_ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
