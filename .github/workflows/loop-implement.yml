name: Loop / implement

on:
  workflow_call:
    inputs:
      lfs:
        description: Fetch Git LFS objects on checkout
        type: boolean
        default: false
      setup_bun:
        description: Deprecated. The toolchain comes from .factory/toolchain.json; false only skips the bun stack's setup.
        type: boolean
        default: true
      timeout_minutes:
        type: number
        default: 240
      loop_ref:
        description: Ref of crucibledx/factory-loop to load the toolchain resolver and setup from.
        type: string
        default: v0
    secrets:
      FACTORY_API_KEY:
        required: true

jobs:
  implement:
    if: github.event_name == 'issues' && github.event.label.name == 'loop:implement'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    concurrency:
      group: loop-implement-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: ${{ inputs.lfs }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crucibledx/factory-loop
          ref: ${{ inputs.loop_ref }}
          path: .factory-loop
          persist-credentials: false
      - id: toolchain
        run: python3 .factory-loop/scripts/toolchain.py
      - if: steps.toolchain.outputs.stack != 'bun' || inputs.setup_bun
        uses: ./.factory-loop/.github/actions/setup-toolchain
        with:
          stack: ${{ steps.toolchain.outputs.stack }}
      - name: Move the factory-loop checkout aside
        # The repo's checks (a tree-wide prettier, for one) must not see factory-loop's files. It comes back at
        # the end of the job: the runner re-resolves the local composite action for its post phase.
        run: mv .factory-loop "$RUNNER_TEMP/factory-loop"
      - uses: Factory-AI/droid-action@035954f0d86a72304d87a75a8625aa34699e1274 # v14
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          label_trigger: loop:implement
          track_progress: "true"
          settings: '{"extraKnownMarketplaces":{"factory-loop":{"source":{"source":"github","repo":"crucibledx/factory-loop"}}},"enabledPlugins":{"crucible-loop@factory-loop":true}}'
      - name: Restore the factory-loop checkout
        if: always()
        run: mv "$RUNNER_TEMP/factory-loop" .factory-loop
