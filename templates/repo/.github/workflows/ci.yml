# Org CI. Logic lives in crucibledx/factory-loop (loop-ci.yml). Commands come from .factory/toolchain.json;
# set inputs below only to override them for this caller.
# Required checks for the main ruleset: `ci / quality`, `ci / test`, and `ci / build` when a build command
# resolves (from the declaration, the stack default or a caller input).
# The test job needs `checks: write` (JUnit report), so keep it in the permissions below.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

jobs:
  ci:
    uses: crucibledx/factory-loop/.github/workflows/loop-ci.yml@v0
    # with:
    #   test_command: bun test
    #   build_command: bun run build
    #   build_verify: ./dist/<binary> --version
